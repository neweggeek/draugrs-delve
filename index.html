<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Draugr's Delve</title>
<style>
html,body{margin:0;height:100%;background:#0b0709;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game,#g3{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;background:#120c10}
#g3{display:none}body.v3d #g3{display:block}body.v3d #game{background:transparent}
.touch{position:fixed;display:none;z-index:2;bottom:calc(14px + env(safe-area-inset-bottom))}
body.is-touch #pad{display:flex}
body.is-touch #btns{display:grid}
body.is-touch:not(.portrait) .touch,body.is-touch:not(.portrait) #bUse{opacity:.62}
#pad{left:calc(14px + env(safe-area-inset-left));width:160px;height:80px;border-radius:40px;background:rgba(240,128,48,.14);border:2px solid rgba(242,193,78,.45);touch-action:none}
#pad .half{flex:1;display:flex;align-items:center;justify-content:center;color:rgba(242,193,78,.85)}
#btns{right:calc(12px + env(safe-area-inset-right));grid-template-columns:repeat(3,62px);grid-template-rows:50px 62px;gap:9px}
.btn{width:62px;height:62px;border-radius:50%;background:rgba(240,128,48,.16);border:2px solid rgba(242,193,78,.5);color:#f2c14e;font:700 12px ui-monospace,monospace;display:flex;align-items:center;justify-content:center;padding:0;touch-action:none}
.btn.sm{height:50px;border-radius:25px}
#bFire{grid-column:1;grid-row:1;display:none;background:rgba(240,128,48,.3)}body.has-fire #bFire{display:flex}
#bHeal{grid-column:2;grid-row:1}#bRoll{grid-column:3;grid-row:1}#bBlk{grid-column:1;grid-row:2}#bAtk{grid-column:2;grid-row:2;background:rgba(200,64,42,.28)}#bJump{grid-column:3;grid-row:2}
#bUse{position:fixed;z-index:2;display:none;right:calc(12px + env(safe-area-inset-right));bottom:calc(150px + env(safe-area-inset-bottom));width:90px;height:40px;border-radius:20px;background:rgba(79,179,154,.3);border-color:rgba(143,214,195,.8);color:#e8fff8}
.btn.on,#pad .half.on{background:rgba(242,193,78,.3)}
#mute{position:fixed;z-index:3;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));width:44px;height:44px;border-radius:8px;border:2px solid rgba(242,193,78,.4);background:rgba(20,12,16,.7);color:#f2c14e;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
#view{position:fixed;z-index:3;top:calc(10px + env(safe-area-inset-top));right:calc(62px + env(safe-area-inset-right));width:44px;height:44px;border-radius:8px;border:2px solid rgba(242,193,78,.4);background:rgba(20,12,16,.7);color:#f2c14e;font:700 13px ui-monospace,monospace;padding:0;cursor:pointer}

// shade a #rrggbb color by f (1 = same)
function shadeHex(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(f > 1 ? v + (255 - v) * (f - 1) : v * f))));
  return `rgb(${c})`;
}
// Hi-res grid: each grid pixel becomes 2x2 fine pixels. Scale2x rounds stair-step diagonals and corners,
// the dark outline thins to one fine pixel around colored areas, and every color patch gets a light top
// edge and a shaded bottom edge so shapes read with volume. Returns rows of [char, shade] (-1, 0, 1).
function hiGrid(rows, w, h) {
  const at = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? '.' : (rows[y][x] || '.');
  const W2 = w * 2, H2 = h * 2, g = Array.from({ length: H2 }, () => Array(W2).fill('.'));
  const solid = c => c !== '.', col = c => c !== '.' && c !== 'k';
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const E = at(x, y), B = at(x, y - 1), D = at(x - 1, y), F = at(x + 1, y), Hh = at(x, y + 1);
    g[y * 2][x * 2] = D === B && B !== F && D !== Hh ? D : E;
    g[y * 2][x * 2 + 1] = B === F && B !== D && F !== Hh ? F : E;
    g[y * 2 + 1][x * 2] = D === Hh && D !== B && Hh !== F ? D : E;
    g[y * 2 + 1][x * 2 + 1] = Hh === F && D !== Hh && B !== F ? F : E;
  }
  const G = (x, y) => (x < 0 || y < 0 || x >= W2 || y >= H2) ? '.' : g[y][x];
  // thin outlines: an outline pixel next to color keeps only its inner half
  const out = g.map(r => r.slice());
  for (let y = 0; y < H2; y++) for (let x = 0; x < W2; x++) {
    if (g[y][x] !== 'k') continue;
    const lx = x >> 1, ly = y >> 1;
    if (!(col(at(lx - 1, ly)) || col(at(lx + 1, ly)) || col(at(lx, ly - 1)) || col(at(lx, ly + 1)))) continue;
    let near = false, open = false;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (col(G(x + dx, y + dy))) near = true;
    if (!solid(G(x - 1, y)) || !solid(G(x + 1, y)) || !solid(G(x, y - 1)) || !solid(G(x, y + 1))) open = true;
    if (!near && open) out[y][x] = '.';

    const d = document.createElement('canvas'); d.width = cw; d.height = chh;

    { icon: SPR.up, lines: [['XP', '#4a2a14'], ['+1500', '#3a8a3a']] },
    { icon: SPR.potion, lines: [['FLASK', '#4a2a14'], ['+1 MAX', '#3a8a3a']] },
    { icon: SPR.coin, lines: [['LEVEL', '#4a2a14'], [String(CH.lvl), '#4a2a14']] },
    { icon: SPR.flame, lines: [['NEW SPELL!', '#4a2a14'], ['FIREBALL', '#4a2a14']] }
  ];
  cells.forEach((c, i) => {
    const cx = px + 23 + i * 46;
    ctx.drawImage(c.icon.c[0], Math.round(cx - c.icon.w), py + 4, c.icon.w * 2, c.icon.h * 2);
    c.lines.forEach(([t, col], j) => drawText(t, cx, py + 25 + j * 8, col, 1, 'center'));
  });
  if (winT > 70 && ((frameN / 30) | 0) % 2 === 0) drawTextS(isTouchUI() ? 'TAP TO CONTINUE' : 'PRESS ANY BUTTON TO CONTINUE', W / 2, 165, '#f4ead6', 1, 'center');
}
let useShown = false;
function render() {
  uiRects = [];
  ctx.setTransform(RES, 0, 0, RES, 0, 0);
  if (V3.on) ctx.clearRect(0, 0, W, H); else { ctx.fillStyle = '#120c10'; ctx.fillRect(0, 0, W, H); }
  if (state === 'title') drawTitle();
  else if (state === 'class') drawClassSelect();
  else if (state === 'win') drawWin();
  else if (state === 'menu') drawMenu();
  else {
    drawWorld(); drawHUD();
    if (state === 'dead') {
      ctx.fillStyle = `rgba(10,4,8,${Math.min(.75, deadT / 60)})`; ctx.fillRect(0, 0, W, H);
      if (deadT > 30) {
        ctx.globalAlpha = Math.min(1, (deadT - 30) / 30);
        ctx.fillStyle = 'rgba(40,6,8,.8)'; ctx.fillRect(0, 62, W, 34);
        drawTextS('YOU DIED', W / 2, 66, '#c8402a', 4, 'center');
        if (CH.xp > 0) drawTextS(CH.xp + ' XP LEFT WHERE YOU FELL', W / 2, 104, '#7fe08a', 1, 'center');
        ctx.globalAlpha = 1;
      }
    }
    if (state === 'clear') {
      ctx.fillStyle = `rgba(10,4,8,${Math.min(.72, clearT / 40)})`; ctx.fillRect(0, 0, W, H);
      const nx = LEVELS[levelIdx + 1];
      drawTextS('AREA CLEAR', W / 2, 40, '#f2c14e', 3, 'center');
      drawTextS('NEXT: AREA ' + (levelIdx + 2), W / 2, 72, '#d8c8b8', 1, 'center');
      drawTextS(nx.name, W / 2, 81, '#f4ead6', 2, 'center');
      drawSpr(SPR[ETYPES[nx.mob].spr], W / 2, 124 + Math.round(Math.sin(frameN * .1) * 2), -1, false, 0, 0, 0);
      if (clearT > 50 && ((frameN / 30) | 0) % 2 === 0) drawTextS(isTouchUI() ? 'TAP TO GO ON' : 'PRESS ANY BUTTON', W / 2, 140, '#f4ead6', 1, 'center');
    }
    if (fadeT > 0) { ctx.fillStyle = `rgba(10,4,8,${fadeT / 30})`; ctx.fillRect(0, 0, W, H); }
  }
  drawText(VERSION, W / 2, 1, 'rgba(216,200,184,.45)', 1, 'center'); // build watermark
  const ulabel = interact ? interact.label : P && state === 'play' && onLedge() ? 'DROP' : '';
  const want = isTouchUI() && state === 'play' && !!ulabel;
  document.body.classList.toggle('has-fire', hasFire());
  document.body.classList.toggle('in-play', state === 'play');
  if ((want && ulabel) !== useShown) { useShown = want && ulabel; const b = document.getElementById('bUse'); b.style.display = want ? 'flex' : 'none'; if (want) b.textContent = ulabel; }
}

// ================= Main loop =================
let last = performance.now(), acc = 0;
toTitle();
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  pollPad();
  let steps = 0;
  while (acc >= 1 / 60 && steps < 6) { step(); acc -= 1 / 60; steps++; }
  render();
  Music.tick();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('pagehide', () => { if (CH && state === 'play') save(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && CH && state === 'play') save(); if (!AC) return; if (document.hidden) AC.suspend().catch(() => {}); else AC.resume().catch(() => {}); });
setMuted(muted);
// test hook (harmless): lets automated checks inspect state
window.__dd = { get state() { return state; }, get P() { return P; }, get CH() { return CH; }, get boss() { return boss; }, get enemies() { return enemies; }, get menu() { return menu; },
  get levelIdx() { return levelIdx; }, get projs() { return projs; },
  newGame(cls = 'knight', area = 0) { CH = newChar(cls); CH.unlocked = 10; enterArea(area); },
  tp(x, y = 20) { P.x = x; P.y = y; camX = clamp(x - 140, 0, MW * TS - W); }, ARENA() { return ARENA_X; }, uiKey, rest };
</script>
