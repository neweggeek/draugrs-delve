<!DOCTYPE html>
<html lang="en">
<head>

<title>Draugr's Delve</title>
<style>
html,body{margin:0;height:100%;background:#0b0709;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game,#g3{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;background:#120c10}

.touch{position:fixed;display:none;z-index:2;bottom:calc(14px + env(safe-area-inset-bottom))}

body.is-touch #btns{display:grid}
body.is-touch:not(.portrait) .touch,body.is-touch:not(.portrait) #bUse{opacity:.62}
#pad{left:calc(14px + env(safe-area-inset-left));width:160px;height:80px;border-radius:40px;background:rgba(240,128,48,.14);border:2px solid rgba(242,193,78,.45);touch-action:none}
#pad .half{flex:1;display:flex;align-items:center;justify-content:center;color:rgba(242,193,78,.85)}

.btn{width:62px;height:62px;border-radius:50%;background:rgba(240,128,48,.16);border:2px solid rgba(242,193,78,.5);color:#f2c14e;font:700 12px ui-monospace,monospace;display:flex;align-items:center;justify-content:center;padding:0;touch-action:none}
.btn.sm{height:50px;border-radius:25px}

.btn.on,#pad .half.on{background:rgba(242,193,78,.3)}
#mute{position:fixed;z-index:3;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));width:44px;height:44px;border-radius:8px;border:2px solid rgba(242,193,78,.4);background:rgba(20,12,16,.7);color:#f2c14e;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}

#rot{position:fixed;left:0;right:0;text-align:center;color:#b8a596;font:12px ui-monospace,monospace;display:none}

function mkSprite(src) {
  const rows = src.trim().split('\n').map(s => s.trim());
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const make = fn => {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d');
    rows.forEach((r, yy) => { for (let i = 0; i < r.length; i++) { const ch = r[i]; if (ch !== '.' && PAL[ch]) { x.fillStyle = fn(ch); x.fillRect(i, yy, 1, 1); } } });
    return c;
  };
  const flip = c => {
    const d = document.createElement('canvas'); d.width = w; d.height = h;
    const x = d.getContext('2d'); x.translate(w, 0); x.scale(-1, 1); x.drawImage(c, 0, 0); return d;
  };
  const n = make(ch => PAL[ch]), wh = make(() => '#ffffff'), rd = make(() => '#ff3a2a');
  let x0 = w, y0 = h, x1 = 0, y1 = 0;
  rows.forEach((r, yy) => { for (let i = 0; i < r.length; i++) if (r[i] !== '.') { x0 = Math.min(x0, i); x1 = Math.max(x1, i + 1); y0 = Math.min(y0, yy); y1 = Math.max(y1, yy + 1); } });
  return { w, h, c: [n, flip(n)], wc: [wh, flip(wh)], rc: [rd, flip(rd)], bb: { x0, y0, x1, y1 } };
}

  ctx.drawImage(white === 'r' ? s.rc[i] : white ? s.wc[i] : s.c[i], dx, dy);
}

// 3D: the level is drawn by WebGL under this canvas, so only draw what is not in the level mesh (the door).

function lights3d(withPlayer) {

    out.push({ x: pr.x + 3, y: pr.y + 3, z: 0, r: 50, c: pr.kind === 'frost' ? [.2, .5, .7] : [.9, .45, .15] });
  const near = SPAWNS.torches.filter(t => Math.abs(t.x - camX - W / 2) < W).sort((a, b) => Math.abs(a.x - camX - W / 2) - Math.abs(b.x - camX - W / 2));
  for (const t of near) out.push({ x: t.x, y: t.y - 4, z: V3.ZB + 6, r: 96 + fl, c: [.85, .45, .18] });

function drawBackdrop(x0) {

  const lights = [];
  for (const t of SPAWNS.torches) if (t.x > x0 - 60 && t.x < x0 + W + 60) { const q = V3.pt(t.x, t.y); flameAt(q.x, q.y); lights.push({ x: q.x - x0, y: q.y - 4, r: 78 + Math.sin(frameN * .2 + t.x) * 3, c: ORANGE }); }
  for (const p of particles) { ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x - camX), Math.round(p.y), p.s, p.s); }

function drawTitle() {

function drawWin() {

let useShown = false;

// ================= Main loop =================
let last = performance.now(), acc = 0;
toTitle();
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  pollPad();
  let steps = 0;
  while (acc >= 1 / 60 && steps < 6) { step(); acc -= 1 / 60; steps++; }
  render();
  Music.tick();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
